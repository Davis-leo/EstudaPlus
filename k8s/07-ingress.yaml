# Opcional - só se você instalar ingress-nginx no Kind
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estudaplus-ingress
  namespace: estudaplus
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: estudaplus.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: frontend-service, port: {number: 3000}}
      - path: /api
        pathType: Prefix
        backend:
          service: {name: backend-service, port: {number: 8000}}
