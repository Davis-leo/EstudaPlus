apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: estudaplus
  labels: {app: backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
      - name: backend
        image: estudaplus-backend:v1
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        envFrom:
        - configMapRef: {name: backend-config}
        - secretRef: {name: backend-secret}
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: backend-secret, key: DB_PASSWORD}}
        - name: DJANGO_SECRET_KEY
          valueFrom: {secretKeyRef: {name: backend-secret, key: DJANGO_SECRET_KEY}}
        - name: STRIPE_SECRET_KEY
          valueFrom: {secretKeyRef: {name: backend-secret, key: STRIPE_SECRET_KEY}}
        - name: STRIPE_PUBLIC_KEY
          valueFrom: {configMapKeyRef: {name: backend-config, key: STRIPE_PUBLIC_KEY}}
        livenessProbe:
          httpGet: {path: /admin/login/, port: 8000}
          initialDelaySeconds: 20
          periodSeconds: 15
        readinessProbe:
          httpGet: {path: /admin/login/, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests: {cpu: "250m", memory: "256Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: estudaplus
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
  type: ClusterIP